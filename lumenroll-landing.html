<style>
:root{
  --ink:#dfe2f2; --dim:#9297b4; --accent:#7cc4e8; --lav:#a98be0;
  --night:#10111f; --night-deep:#0d0e1a; --panel:#1a1c30;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Inter",system-ui,sans-serif;color:var(--ink);
  background:var(--night);animation:marquee 26s ease-in-out infinite;
  min-height:100vh;overflow-x:hidden;
}
a.page{display:block;color:inherit;text-decoration:none;min-height:100vh;position:relative}
@keyframes marquee{0%{background-color:#10111f}33%{background-color:#15122b}66%{background-color:#0f1c29}100%{background-color:#10111f}}
@keyframes glowSway{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.15)}100%{transform:translate(0,0) scale(1)}}
@keyframes glowSway2{0%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-50px,-30px) scale(1)}100%{transform:translate(0,0) scale(1.1)}}
@keyframes logoPulse{0%,100%{box-shadow:0 0 0 0 rgba(124,196,232,.5)}50%{box-shadow:0 0 22px 4px rgba(124,196,232,.28)}}
@keyframes playPulse{0%,100%{box-shadow:0 0 0 0 rgba(124,196,232,.45)}50%{box-shadow:0 0 18px 2px rgba(124,196,232,.28)}}

.glow{position:fixed;border-radius:9999px;filter:blur(64px);pointer-events:none;z-index:0}
.glow-1{top:-96px;left:-64px;width:320px;height:320px;background:rgba(124,196,232,.3);animation:glowSway 18s ease-in-out infinite}
.glow-2{bottom:-80px;right:-64px;width:288px;height:288px;background:rgba(169,139,224,.25);animation:glowSway2 22s ease-in-out infinite}

.wrap{position:relative;z-index:1}
header.bar{position:sticky;top:0;z-index:30;border-bottom:1px solid rgba(255,255,255,.1);
  background:rgba(16,17,31,.4);backdrop-filter:blur(16px)}
.bar-in{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px}
.logo{position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--lav));box-shadow:0 0 0 1px rgba(255,255,255,.2);
  animation:logoPulse 3.6s ease-in-out infinite}
.tri{display:block;width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid var(--night-deep);transform:translateX(1px)}
.brand-name{font-family:"Space Grotesk",sans-serif;font-size:18px;font-weight:600;letter-spacing:-.01em}
.brand-name span{color:var(--accent)}
.pill{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);border-radius:9999px;
  padding:4px 12px;font-size:11px;font-weight:500;color:var(--dim)}

section.hero{padding:32px 16px 24px}
.eyebrow{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.25em;color:var(--accent)}
h1{margin-top:12px;max-width:20ch;font-family:"Space Grotesk",sans-serif;font-size:32px;font-weight:600;line-height:1.15;text-wrap:balance}
.sub{margin-top:12px;max-width:42ch;font-size:14px;line-height:1.6;color:var(--dim)}
.cta{margin-top:20px;display:inline-flex;align-items:center;gap:8px;border-radius:9999px;background:var(--accent);
  color:var(--night-deep);padding:12px 20px;font-size:14px;font-weight:600}
.cta .tri{border-top-width:5px;border-bottom-width:5px;border-left-width:8px}

.label{display:flex;align-items:flex-end;justify-content:space-between;padding:0 16px 12px}
.label h2{font-family:"Space Grotesk",sans-serif;font-size:16px;font-weight:600}
.label span{font-size:12px;color:var(--dim)}

.grid{display:grid;grid-template-columns:1fr;gap:12px;padding:0 16px 40px}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{border-radius:16px;background:rgba(255,255,255,.04);padding:8px;box-shadow:0 0 0 1px rgba(255,255,255,.1);
  transition:transform .3s ease}
.card:hover{transform:translateY(-4px)}
.thumb{position:relative}
.thumb img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:var(--panel)}
.play{position:absolute;inset:0;display:grid;place-items:center}
.play>span{display:grid;place-items:center;width:48px;height:48px;border-radius:9999px;background:rgba(255,255,255,.15);
  backdrop-filter:blur(8px);box-shadow:0 0 0 1px rgba(255,255,255,.3);animation:playPulse 4s ease-in-out infinite;transition:transform .3s ease}
.card:hover .play>span{transform:scale(1.1)}
.play .tri{border-top-width:7px;border-bottom-width:7px;border-left-width:12px;border-left-color:#fff;transform:translateX(2px)}
.time{position:absolute;right:8px;bottom:8px;border-radius:6px;background:rgba(0,0,0,.55);padding:2px 8px;
  font-size:11px;font-weight:500;color:rgba(255,255,255,.9);backdrop-filter:blur(4px)}
.card h3{margin:10px 0 0;padding:0 4px;font-family:"Space Grotesk",sans-serif;font-size:14px;font-weight:500}

footer{border-top:1px solid rgba(255,255,255,.1);background:rgba(13,14,26,.5);backdrop-filter:blur(16px)}
.foot-in{display:flex;align-items:center;justify-content:space-between;padding:20px 16px}
.foot-brand{display:flex;align-items:center;gap:8px}
.foot-logo{display:grid;place-items:center;width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--lav))}
.foot-logo .tri{border-top-width:4px;border-bottom-width:4px;border-left-width:7px}
.foot-brand span{font-family:"Space Grotesk",sans-serif;font-size:14px;font-weight:600}
.foot-in p{font-size:12px;color:var(--dim)}
</style>
</head>
